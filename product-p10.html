<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trail Running Shoe — StepStyle</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">👟 Trail Running Shoe</h1>
            <nav>
                <a href="index.html">Start</a>
                <a href="products.html">Schuhe</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html"
                    >Warenkorb (<span id="cart-count">0</span>)</a
                >
            </nav>
        </header>

        <main class="container product-detail">
            <article>
                <h2>Trail Running Shoe</h2>
                <div class="detail-grid">
                    <div class="media-text">
                        <img
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fthfvnext.bing.com%2Fth%2Fid%2FOIP.QGshENQAn8cNlbjL51PVZgHaFX%3Fcb%3Dthfvnextfalcon3%26pid%3DApi&f=1&ipt=708a2faecb4e4b941234d2b1acc56d53634ad94d43e9c94bb7294963801b6e57&ipo=images"
                            alt="Trail Running Shoe"
                        />
                        <video
                            controls
                            class="product-video"
                            src="https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4"
                        >
                            Ihr Browser unterstützt kein Video.
                        </video>
                    </div>
                    <div class="meta">
                        <p class="price">€154.50</p>
                        <p>
                            Leichte und wendige Trailrunner mit aggressivem
                            Profil für Off-Road-Läufe.
                        </p>
                        <form
                            onsubmit="
                                orderProduct('p10', 'Trail Running Shoe', this);
                                return false;
                            "
                        >
                            <label for="qty-p10">Menge</label>
                            <input
                                id="qty-p10"
                                name="qty"
                                type="number"
                                value="1"
                                min="1"
                            />
                            <label for="name-p10">Name</label>
                            <input id="name-p10" name="name" required />
                            <label for="email-p10">E-Mail</label>
                            <input
                                id="email-p10"
                                name="email"
                                type="email"
                                required
                            />
                            <button type="submit">Jetzt bestellen</button>
                        </form>
                        <button
                            onclick="
                                addToCart('p10');
                                updateCartCount();
                                alert('Produkt zum Warenkorb hinzugefügt');
                            "
                        >
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 StepStyle — Premium Schuhshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
