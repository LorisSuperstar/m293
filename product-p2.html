<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Classic Leather Oxford — StepStyle</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">👟 Classic Leather Oxford</h1>
            <nav>
                <a href="index.html">Start</a>
                <a href="products.html">Schuhe</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html"
                    >Warenkorb (<span id="cart-count">0</span>)</a
                >
            </nav>
        </header>

        <main class="container product-detail">
            <article>
                <h2>Classic Leather Oxford</h2>
                <div class="detail-grid">
                    <div class="media-text">
                        <img
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwww.cheaney.co.uk%2Fimages%2Fcheaney-lime-classic-oxford-in-black-calf-leather-leather-sole-p34-1274_image.jpg&f=1&nofb=1&ipt=af51ec5272cf0f424face2d45b43a4c90c69c95af2da121723320a963f619597"
                            alt="Classic Leather Oxford"
                        />
                        <video
                            controls
                            class="product-video"
                            src="./Images/Shoe2.mp4"
                        >
                            Ihr Browser unterstützt kein Video.
                        </video>
                    </div>
                    <div class="meta">
                        <p class="price">€199.99</p>
                        <p>
                            Elegante Lederschuhe im klassischen Oxford-Stil.
                            Ideal für Büro und formelle Anlässe.
                        </p>
                        <form
                            onsubmit="
                                orderProduct(
                                    'p2',
                                    'Classic Leather Oxford',
                                    this,
                                );
                                return false;
                            "
                        >
                            <label for="qty-p2">Menge</label>
                            <input
                                id="qty-p2"
                                name="qty"
                                type="number"
                                value="1"
                                min="1"
                            />
                            <label for="name-p2">Name</label>
                            <input id="name-p2" name="name" required />
                            <label for="email-p2">E-Mail</label>
                            <input
                                id="email-p2"
                                name="email"
                                type="email"
                                required
                            />
                            <button type="submit">Jetzt bestellen</button>
                        </form>
                        <button
                            onclick="
                                addToCart('p2');
                                updateCartCount();
                                alert('Produkt zum Warenkorb hinzugefügt');
                            "
                        >
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 StepStyle — Premium Schuhshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
