<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Videos</title>
    <link rel="stylesheet" type="text/css" href="./Style.css" />
  </head>
  <body>
    <header>
      <h1 class="Title">Serien & Shows</h1>
      <nav>
        <a href="Index.html"><button class="MediaType">Home</button></a>
        <a href="Musik.html"><button class="MediaType">Musik</button></a>
        <a href="Games.html"><button class="MediaType">Games</button></a>
      </nav>
    </header>

    <main class="container">
      <div style="text-align:center; margin-bottom:1vh;">
        <button id="layoutToggle" class="MediaType">Wechsel zu Flex-Layout</button>
      </div>

      <section id="collection" class="grid">
        <article class="card">
          <a href="https://www.imdb.com/title/tt4158110/" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/en/5/57/Mr._Robot_Season_1.jpg" alt="Mr. Robot" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22300%22><rect fill=%22%23f3f4f6%22 width=%22100%25%22 height=%22100%25%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23888%22 font-family=%22Arial%22 font-size=%2224%22>Cover%20nicht%20verf%C3%BCgbar</text></svg>' />
            <h3 class="FillerTitle">Mr. Robot</h3>
          </a>
          <p class="Filler">Sam Esmail — 2015–2019</p>
        </article>
      </section>
    </main>

    <script>
      const btn = document.getElementById('layoutToggle');
      const col = document.getElementById('collection');
      btn.addEventListener('click', () => {
        if (col.classList.contains('grid')) {
          col.classList.remove('grid');
          col.classList.add('flex');
          btn.textContent = 'Wechsel zu Grid-Layout';
        } else {
          col.classList.remove('flex');
          col.classList.add('grid');
          btn.textContent = 'Wechsel zu Flex-Layout';
        }
      });
    </script>
  </body>
</html>
