<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Musik</title>
        <link rel="stylesheet" type="text/css" href="./Style.css" />
    </head>
    <body>
        <header>
            <h1 class="Title">Meine Musik</h1>
            <nav>
                <a href="Index.html" class="MediaType">Home</a>
                <a href="Videos.html" class="MediaType">Videos</a>

            </nav>
        </header>

        <main class="container">
            <section id="collection" class="grid">
                <article class="card">
                    <a
                        href="https://en.wikipedia.org/wiki/Around_the_World_(Daft_Punk_song)"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <div class="cover-wrapper">
                            <img
                                src="https://upload.wikimedia.org/wikipedia/en/6/6f/Daftpunk-homework.jpg"
                                alt="Around the World - Daft Punk"
                            />
                        </div>

                    </a>
                    <p class="Filler">Daft Punk — 1997</p>

                <article class="card">
                    <a
                        href="https://en.wikipedia.org/wiki/Yellow_Submarine_(album)"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <div class="cover-wrapper">
                            <img
                                src="https://upload.wikimedia.org/wikipedia/en/6/67/BeatlesYellowSubmarineAlbumCover.jpg"
                                alt="Yellow Submarine"
                            />
                        </div>
                        <h3 class="FillerTitle">Yellow Submarine</h3>
