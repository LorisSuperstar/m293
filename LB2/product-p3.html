<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hiking Mountain Boot — StepStyle</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">👟 Hiking Mountain Boot</h1>
            <nav>
                <a href="index.html">Start</a>
                <a href="products.html">Schuhe</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html"
                    >Warenkorb (<span id="cart-count">0</span>)</a
                >
            </nav>
        </header>

        <main class="container product-detail">
            <article>
                <h2>Hiking Mountain Boot</h2>
                <div class="detail-grid">
                    <div class="media-text">
                        <img
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.we6pLEmhCH2diff09in2CQHaGN%3Fpid%3DApi&f=1&ipt=d1e1dcde88c3c6a72e93772e9a56875794be878366f1e368362766031174ad4f&ipo=images"
                            alt="Hiking Mountain Boot"
                        />
                    </div>
                    <div class="meta">
                        <p class="price">€189.50</p>
                        <p>
                            Robuste Wanderstiefel mit wasserfester Membran und
                            rutschfesten Sohlen für Bergtouren.
                        </p>
                        <form
                            onsubmit="
                                orderProduct(
                                    'p3',
                                    'Hiking Mountain Boot',
                                    this,
                                );
                                return false;
                            "
                        >
                            <label for="qty-p3">Menge</label>
                            <input
                                id="qty-p3"
                                name="qty"
                                type="number"
                                value="1"
                                min="1"
                            />
                            <label for="name-p3">Name</label>
                            <input id="name-p3" name="name" required />
                            <label for="email-p3">E-Mail</label>
                            <input
                                id="email-p3"
                                name="email"
                                type="email"
                                required
                            />
                            <button type="submit">Jetzt bestellen</button>
                        </form>
                        <button
                            onclick="
                                addToCart('p3');
                                updateCartCount();
                                alert('Produkt zum Warenkorb hinzugefügt');
                            "
                        >
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 StepStyle — Premium Schuhshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
