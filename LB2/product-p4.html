<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Summer Beach Sandal — StepStyle</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">👟 Summer Beach Sandal</h1>
            <nav>
                <a href="index.html">Start</a>
                <a href="products.html">Schuhe</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html"
                    >Warenkorb (<span id="cart-count">0</span>)</a
                >
            </nav>
        </header>

        <main class="container product-detail">
            <article>
                <h2>Summer Beach Sandal</h2>
                <div class="detail-grid">
                    <div class="media-text">
                        <img
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi5.walmartimages.com%2Fseo%2FAloohaidyvio-Flat-Sandals-for-Women-Trendy-Summer-Flat-Sandals-Beautiful-Vacation-Beach-Sandals_230075d6-5cba-4f09-8e19-8358a50145c4.12d3bc404d352bac76be5c84c9c1692c.jpeg&f=1&nofb=1&ipt=a0491f4dfcd077fd40f15b4d0357bc6b86b117373e490d75b46def4e7d7da49e"
                            alt="Summer Beach Sandal"
                        />
                        <video
                            controls
                            class="product-video"
                            src="./BestVideo.mp4"
                        >
                            Ihr Browser unterstützt kein Video.
                        </video>
                    </div>
                    <div class="meta">
                        <p class="price">€49.99</p>
                        <p>
                            Bequeme Strandsandalen aus hautfreundlichem Material
                            mit ergonomischem Fußbett.
                        </p>
                        <form
                            onsubmit="
                                orderProduct('p4', 'Summer Beach Sandal', this);
                                return false;
                            "
                        >
                            <label for="qty-p4">Menge</label>
                            <input
                                id="qty-p4"
                                name="qty"
                                type="number"
                                value="1"
                                min="1"
                            />
                            <label for="name-p4">Name</label>
                            <input id="name-p4" name="name" required />
                            <label for="email-p4">E-Mail</label>
                            <input
                                id="email-p4"
                                name="email"
                                type="email"
                                required
                            />
                            <button type="submit">Jetzt bestellen</button>
                        </form>
                        <button
                            onclick="
                                addToCart('p4');
                                updateCartCount();
                                alert('Produkt zum Warenkorb hinzugefügt');
                            "
                        >
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 StepStyle — Premium Schuhshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
