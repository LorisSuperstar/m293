<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Winter Snow Boot — StepStyle</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">👟 Winter Snow Boot</h1>
            <nav>
                <a href="index.html">Start</a>
                <a href="products.html">Schuhe</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html"
                    >Warenkorb (<span id="cart-count">0</span>)</a
                >
            </nav>
        </header>

        <main class="container product-detail">
            <article>
                <h2>Winter Snow Boot</h2>
                <div class="detail-grid">
                    <div class="media-text">
                        <img
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse3.mm.bing.net%2Fth%2Fid%2FOIP.EqrL9DS68wR483fkueDBXAHaHa%3Fr%3D0%26pid%3DApi&f=1&ipt=2f0672a9970338f8881e5b882c21fc583ba26c216bc4e141465d2060ee428a72&ipo=images"
                            alt="Winter Snow Boot"
                        />
                        <video
                            controls
                            class="product-video"
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse3.mm.bing.net%2Fth%2Fid%2FOIP.EqrL9DS68wR483fkueDBXAHaHa%3Fr%3D0%26pid%3DApi&f=1&ipt=2f0672a9970338f8881e5b882c21fc583ba26c216bc4e141465d2060ee428a72&ipo=images"
                        >
                            Ihr Browser unterstützt kein Video.
                        </video>
                    </div>
                    <div class="meta">
                        <p class="price">€159.90</p>
                        <p>
                            Wärmeisolierte Winterstiefel mit Gripp-Sohle und
                            warmem Innenfutter für eisige Bedingungen.
                        </p>
                        <form
                            onsubmit="
                                orderProduct('p5', 'Winter Snow Boot', this);
                                return false;
                            "
                        >
                            <label for="qty-p5">Menge</label>
                            <input
                                id="qty-p5"
                                name="qty"
                                type="number"
                                value="1"
                                min="1"
                            />
                            <label for="name-p5">Name</label>
                            <input id="name-p5" name="name" required />
                            <label for="email-p5">E-Mail</label>
                            <input
                                id="email-p5"
                                name="email"
                                type="email"
                                required
                            />
                            <button type="submit">Jetzt bestellen</button>
                        </form>
                        <button
                            onclick="
                                addToCart('p5');
                                updateCartCount();
                                alert('Produkt zum Warenkorb hinzugefügt');
                            "
                        >
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 StepStyle — Premium Schuhshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
