<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Skateboard Chuck Style — StepStyle</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="site-header container">
            <h1 class="logo">👟 Skateboard Chuck Style</h1>
            <nav>
                <a href="index.html">Start</a>
                <a href="products.html">Schuhe</a>
                <a href="contact.html">Kontakt</a>
                <a href="cart.html"
                    >Warenkorb (<span id="cart-count">0</span>)</a
                >
            </nav>
        </header>

        <main class="container product-detail">
            <article>
                <h2>Skateboard Chuck Style</h2>
                <div class="detail-grid">
                    <div class="media-text">
                        <img
                            src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.3-E10ZKugqdRt0mQhmtziQHaE7%3Fpid%3DApi&f=1&ipt=84cb9e1a9a0d5a98b3bffff3e94e5879bd9fe2ddca8cdde0efcb219182bc7c1e&ipo=images"
                            alt="Skateboard Chuck Style"
                        />
                        <video
                            controls
                            class="product-video"
                            src="https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4"
                        >
                            Ihr Browser unterstützt kein Video.
                        </video>
                    </div>
                    <div class="meta">
                        <p class="price">€79.99</p>
                        <p>
                            Ikonischer Canvas-Sneaker mit Gummikappe, ideal zum
                            Skaten und für urbanen Style.
                        </p>
                        <form
                            onsubmit="
                                orderProduct(
                                    'p9',
                                    'Skateboard Chuck Style',
                                    this,
                                );
                                return false;
                            "
                        >
                            <label for="qty-p9">Menge</label>
                            <input
                                id="qty-p9"
                                name="qty"
                                type="number"
                                value="1"
                                min="1"
                            />
                            <label for="name-p9">Name</label>
                            <input id="name-p9" name="name" required />
                            <label for="email-p9">E-Mail</label>
                            <input
                                id="email-p9"
                                name="email"
                                type="email"
                                required
                            />
                            <button type="submit">Jetzt bestellen</button>
                        </form>
                        <button
                            onclick="
                                addToCart('p9');
                                updateCartCount();
                                alert('Produkt zum Warenkorb hinzugefügt');
                            "
                        >
                            In den Warenkorb
                        </button>
                    </div>
                </div>
            </article>
        </main>

        <footer class="site-footer container">
            <p>&copy; 2026 StepStyle — Premium Schuhshop</p>
        </footer>

        <script src="js/cart.js"></script>
    </body>
</html>
